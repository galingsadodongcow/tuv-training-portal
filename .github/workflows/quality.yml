name: Application quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  public-browser:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run public browser and accessibility smoke tests
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/portal.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
